schema: "https://leaves.mintlify.com/schema/docs.json"
theme: "aspen"
name: "Sidero Documentation"

seo:
  metatags:
    canonical: "https://docs.siderolabs.com"

colors:
  # Not light/dark variants of one colour. Per the Mintlify schema: primary is
  # emphasis text in light mode, light is emphasis text in dark mode, dark is
  # buttons and hover states in both modes. Values come from the design-system
  # red ramp (accent.text light, accent.text dark, accent.fill).
  primary: "#B93B46"
  light: "#E48E96"
  dark: "#CF4250"

errors:
  404:
    redirect: false
    title: "Page not found"
    description: "The page you're looking for doesn't exist. [Go home](/)."

favicon: "/images/favicon.svg"

contextual:
  options:
    - "copy"
    - "view"
    - "chatgpt"
    - "claude"

logo:
  light: "/images/sidero-light.svg"
  dark: "/images/sidero-dark.svg"

thumbnails:
  background: "/images/og-background.png"

banner:
  content: "Join us at [TalosCon](http://taloscon.com/) in Amsterdam, Oct 15-16. Tickets are free!"
  dismissible: true

navbar:
  links:
    - label: "Enterprise Support"
      href: "https://www.siderolabs.com/support/"
  # The button Mintlify renders. script/contextual-chrome.js shows it only on
  # products that declare a `cta` in their nav file, relabelled to match, and
  # hides it everywhere else (homepage, changelog, hypervisor). Keep a real
  # button here: it is how the script finds the element, and what the site
  # shows if the script fails.
  primary:
    type: "button"
    label: "Try Talos Omni"
    href: "https://www.siderolabs.com/omni-signup"

footer:
  socials:
    bluesky: "https://bsky.app/profile/siderolabs.com"
    x: "https://x.com/siderolabs"
    github: "https://github.com/siderolabs"
    linkedin: "https://linkedin.com/company/sidero-labs"
    reddit: "https://reddit.com/r/taloslinux"

  global:
    anchors:
      - anchor: "Community"
        href: "https://taloscommunity.slack.com/"
        icon: "slack"

integrations:
  ga4:
    measurementId: "G-PT2W5NT93B"
  posthog:
    apiKey: "phc_D44Y76lThvZBf8s7lpVpPjJm9fNLvCRMluHXtF7bQXT"

redirects:
  - source: "/talos/latest"
    destination: "/talos/v1.14"
  - source: "/talos/latest/:slug*"
    destination: "/talos/v1.14/:slug*"
  - source: "/omni/cluster-management/expose-an-http-service-from-a-cluster"
    destination: "/omni/cluster-management/expose-a-workload-via-service-proxy"
  - source: "/omni/cluster-management/omni-terraform"
    destination: "/omni/cluster-management/terraform-and-omni"
  - source: "/talos/v1.13/deploy-and-manage-workloads/workers-on-controlplane"
    destination: "/talos/v1.13/deploy-and-manage-workloads/workloads-on-controlplane"
  - source: "/talos/v1.12/deploy-and-manage-workloads/workers-on-controlplane"
    destination: "/talos/v1.12/deploy-and-manage-workloads/workloads-on-controlplane"
  - source: "/talos/v1.11/deploy-and-manage-workloads/workers-on-controlplane"
    destination: "/talos/v1.11/deploy-and-manage-workloads/workloads-on-controlplane"
  - source: "/talos/v1.10/deploy-and-manage-workloads/workers-on-controlplane"
    destination: "/talos/v1.10/deploy-and-manage-workloads/workloads-on-controlplane"
  - source: "/talos/v1.9/deploy-and-manage-workloads/workers-on-controlplane"
    destination: "/talos/v1.9/deploy-and-manage-workloads/workloads-on-controlplane"
  - source: "/talos/v1.8/deploy-and-manage-workloads/workers-on-controlplane"
    destination: "/talos/v1.8/deploy-and-manage-workloads/workloads-on-controlplane"
  - source: "/talos/v1.7/deploy-and-manage-workloads/workers-on-controlplane"
    destination: "/talos/v1.7/deploy-and-manage-workloads/workloads-on-controlplane"
  - source: "/talos/v1.6/deploy-and-manage-workloads/workers-on-controlplane"
    destination: "/talos/v1.6/deploy-and-manage-workloads/workloads-on-controlplane"
  - source: "/kubernetes-guides/advanced-guides/kubeprism"
    destination: "/talos/latest/configure-your-talos-cluster/system-configuration/kubeprism"
# What the browser needs to know about each product: display name, whether it
# carries versions, and its call to action. Generated from the product nav
# files so the navbar script cannot drift from the navigation itself.
productNav: "public/script/product-nav.js"

# Rules whose selectors depend on where a product's pages live, generated so
# those paths are never typed into a stylesheet by hand.
productChromeCss: "public/product-chrome.css"

# Homepage. The landing page at public/index.mdx is generated from this block
# plus the products declared in the per-product nav files, so adding a product
# adds its card automatically -- the product only has to say which family it
# belongs to. Regenerated by `make docs.json`; do not edit index.mdx by hand.
#
# Announcement gating: a product appears here once its name is public.
# Announced products without documentation are declared as `soon: true` cards
# below -- present, "Coming soon", not clickable. Unannounced names stay
# commented out until their announcement day; flipping one on is an uncomment
# plus, for a new family, a hero-sentence edit (the lede names the domains the
# page shows, so the promise cannot outrun the page). No ship dates on cards,
# ever.
homepage:
  path: "public/index.mdx"
  title: "Talos Documentation"
  lede: "Kubernetes, virtual machines, and containers, on an immutable operating system you manage through an API."

  families:
    - family: "kubernetes"
      title: "Kubernetes"
      description: "Run Kubernetes on bare metal, in the cloud, on existing hypervisors, or at the edge."

    - family: "hypervisor"
      title: "Hypervisor"
      description: "Run and manage virtual machines directly on Talos hosts."
      cards:
        - title: "Talos Hypervisor"
          tag: "Open source"
          soon: true
          description: "Run virtual machines on a Talos host through native Talos APIs and talosctl."
        - title: "Talos Enterprise Hypervisor"
          tag: "Commercial"
          soon: true
          description: "The enterprise build of Talos Hypervisor: FIPS-enabled builds, SBOMs, VEX, signed images, and 24/7 support."
        # TALOS DIRECTOR -- announced at TalosCon October 14 (or earlier by
        # press release). Uncomment on the announcement.
        # - title: "Talos Director"
        #   tag: "Commercial"
        #   soon: true
        #   description: "Manage hosts, clusters, VMs, storage and networking across a virtualization estate."
        # XENIA -- unannounced. Uncomment when it is. Its navbar button
        # also goes on the Talos Hypervisor product, which has none until then.
        # - title: "Talos Xenia"
        #   tag: "Open source"
        #   soon: true
        #   description: "The management interface for the Talos hypervisor, the way Omni is for Kubernetes."

    - family: "containers"
      title: "Containers"
      description: "Run containers without Kubernetes, declared in machine config."
      cards:
        - title: "Talos Containers"
          tag: "Open source"
          soon: true
          description: "Run OCI containers directly on Talos at the edge, with no Kubernetes control plane to operate."

    # AI -- unannounced. Uncomment when Athena is announced, and add
    # "private AI" to the lede above.
    # - family: "ai"
    #   title: "AI"
    #   description: "Run private AI workloads on infrastructure you control."
    #   cards:
    #     - title: "Talos Linux for AI"
    #       tag: "Open source"
    #       soon: true
    #       description: "Declare an AI stack in machine config and run it on your own hardware."
    #     - title: "Talos Athena"
    #       tag: "Commercial"
    #       soon: true
    #       description: "Deploy and operate private AI: models, vector storage, and the serving stack."

    - family: "tools"
      title: "Tools"
      description: "Services and clients you use with every product above."
      variant: "tools"
      cards:
        - title: "Image Factory"
          href: "/talos/v1.14/learn-more/image-factory"
          description: "Build Talos boot images with the extensions and configuration you need. Hosted community and enterprise instances, or run your own."
        - title: "Discovery Service"
          href: "/talos/v1.14/configure-your-talos-cluster/system-configuration/discovery"
          description: "How Talos nodes find each other across NATs and firewalls. Hosted by Sidero, or self-hosted with an enterprise entitlement."
        - title: "talosctl"
          href: "/talos/v1.14/getting-started/talosctl"
          description: "The command-line client for the Talos API."

  also:
    - label: "Kubernetes Guides"
      href: "/kubernetes-guides/overview/kubernetes-guides-overview"
    - label: "Release notes"
      href: "/changelog"
    - label: "Support"
      href: "https://www.siderolabs.com/support/"
