version: v1alpha1 # Indicates the schema used to decode the contents.
debug: false # Enable verbose logging to the console.
persist: true
# Provides machine specific configuration options.
machine:
    type: worker # Defines the role of the machine within the cluster.
    token: 82jkyk.shie55k1d811gz8u # The `token` is used by a machine to join the PKI of the cluster.
    # The root certificate authority of the PKI.
    ca:
        crt: 
        key: ""
    # Extra certificate subject alternative names for the machine's certificate.
    certSANs: []
    #   # Uncomment this to enable SANs.
    #   - 10.0.0.10
    #   - 172.16.0.10
    #   - 192.168.0.10

    kubelet:
        image: ghcr.io/siderolabs/kubelet:v1.36.3
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
    install:
        disk: /dev/vda
        image: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.13.10
        wipe: false
        grubUseUKICmdline: true
    files:
        - content: created-in-var
          permissions: 0o644
          path: /var/mf/create.txt
          op: create
        - content: '# mf-test manifest'
          permissions: 0o644
          path: /etc/kubernetes/manifests/mf-test.yaml
          op: create
        - content: |
            [metrics]
              address = "0.0.0.0:11234"
          permissions: 0o644
          path: /etc/cri/conf.d/20-customization.part
          op: create
    sysctls:
        kernel.kexec_load_disabled: "1"
    # Features describe individual Talos features that can be switched on or off.
    features:
        diskQuotaSupport: true # Enable XFS project quota support for EPHEMERAL partition and user disks.
        kubePrism:
            enabled: true
            port: 7445
        hostDNS:
            enabled: true
            forwardKubeDNSToHost: true
    
    # # Configures the logging system.
    # logging:
    #     # Logging destination.
    #     destinations:
